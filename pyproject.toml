[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aws_chain_secrets"
version = "1.0.3"
description = "This aims to enable the use of one or more secrets from AWS SecretsManager."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hyouk Oh", email = "h.5.kure@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["boto3"]

[project.urls]
Homepage = "https://github.com/h5kure/aws_chain_secrets"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aws_chain_secrets"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.rst", "/LICENSE"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
