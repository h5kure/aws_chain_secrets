[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aws_chain_secrets"
version = "2.0.0"
description = "Read several AWS Secrets Manager secrets as one key-value store."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hyouk Oh", email = "h.5.kure@gmail.com" }]
requires-python = ">=3.10"
keywords = ["aws", "secrets-manager", "secrets", "boto3", "chainmap", "configuration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# botocore is imported directly. 1.29.13 is the first botocore with BaseClient.close() that imports on
# Python 3.13 or later, which removed `cgi`; boto3 1.26.13 is the first boto3 that requires it.
dependencies = ["boto3>=1.26.13", "botocore>=1.29.13"]

[project.urls]
Homepage = "https://github.com/h5kure/aws_chain_secrets"
Source = "https://github.com/h5kure/aws_chain_secrets"
Changelog = "https://github.com/h5kure/aws_chain_secrets/blob/main/CHANGELOG.md"
Issues = "https://github.com/h5kure/aws_chain_secrets/issues"

[dependency-groups]
dev = [
    "boto3-stubs[secretsmanager]>=1.43.112",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aws_chain_secrets"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
# Not part of strict; an unreachable branch means an annotation does not match what the code handles.
warn_unreachable = true
# Annotations are written where they inform readers and users (py.typed public API), not everywhere:
# an unannotated function is still checked (check_untyped_defs), and `-> Any` would add nothing.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
# json.loads and boto3 return Any; narrowing it would mean restructuring code only for the checker.
warn_return_any = false
