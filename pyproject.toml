[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aws_chain_secrets"
version = "1.0.3"
description = "This aims to enable the use of one or more secrets from AWS SecretsManager."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hyouk Oh", email = "h.5.kure@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = ["boto3"]

[project.urls]
Homepage = "https://github.com/h5kure/aws_chain_secrets"

[dependency-groups]
dev = [
    "boto3-stubs[secretsmanager]>=1.43.112",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aws_chain_secrets"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.rst", "/LICENSE"]

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Existing violations, recorded so the rule set can be enabled now.
# TODO(stage 4): B904 adds exception chaining, which changes __cause__ (behavioral).
"src/aws_chain_secrets/secrets_manager.py" = ["B904"]

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true
# Annotations are written where they inform readers and users (py.typed public API), not everywhere:
# an unannotated function is still checked (check_untyped_defs), and `-> Any` would add nothing.
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
# json.loads and boto3 return Any; narrowing it would mean restructuring code only for the checker.
warn_return_any = false
